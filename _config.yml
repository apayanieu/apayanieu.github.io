# Welcome to Jekyll!
# ... (keep the header comments if you like)

# Theme Settings
remote_theme             : "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin    : "air" # Choose from "default", "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"[reference:1]

# Site Settings
locale                   : "en-US"
title                    : "Alfonso Payan Callejas"
title_separator          : "-"
subtitle                 : "Economics & Applied Mathematics Portfolio"
name                     : &name "Alfonso Payan Callejas"
description              : &description "Dual Degree student in Economics & Applied Mathematics at IE University. Interested in finance, quantitative analysis, and data-driven problem solving."
url                      : "https://apayanieu.github.io"
baseurl                  : ""
repository               : "apayanieu/apayanieu.github.io"

# Site Author
author:
  name             : "Alfonso Payan Callejas"
  avatar           : "images/avatar.jpeg"
  bio              : "Economics & Applied Mathematics student at IE University. Passionate about finance, quantitative analysis, and applying rigorous analytical methods to real-world problems."
  location         : "Madrid, Spain"
  employer         : "IE University"
  email            : "apayan.ieu2024@student.ie.edu"
  uri              : # Your personal website (optional)
  linkedin         : "alfonsopayan-callejas"
  github           : "apayanieu"

# Site Footer
footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/alfonsopayan-callejas"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/apayanieu"

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

head_scripts:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: # true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: false
      share: true

# Outputting
permalink: /:categories/:title/
timezone: Europe/Madrid

# Pagination
paginate: 5
paginate_path: /page:num/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-include-cache
  - jekyll-remote-theme

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-include-cache

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Collections
collections:
  portfolio:
    output: true
    permalink: /:collection/:path/

# Search
search: true
search_full_content: true
